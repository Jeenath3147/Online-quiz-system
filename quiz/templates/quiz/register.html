{% extends 'quiz/base.html' %}

{% block content %}
<div class="auth-container">
    <h2>Create an Account</h2>
    <p class="auth-subtitle">Sign up to start taking quizzes</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="submit-btn">Register</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="{% url 'login' %}">Login here</a></p>
</div>
{% endblock %}
