{% extends 'quiz/base.html' %}

{% block content %}
<div class="auth-container">
    <h2>Delete "{{ quiz_obj.title }}"?</h2>
    <p class="auth-subtitle">This permanently deletes this quiz and every one of its questions and choices. This can't be undone.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="submit-btn danger-btn">Yes, delete it</button>
        <a href="{% url 'manage-quizzes' %}" class="back-btn back-btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
