{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Quiz</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="{% url 'quiz-home' %}" class="brand">
                <span class="brand-icon">📝</span>
                <span class="brand-text">Online Quiz</span>
            </a>
            <nav>
                {% if user.is_authenticated %}
                    <span class="welcome-text">Hi, {{ user.username }}</span>
                    <a href="{% url 'quiz-home' %}">Home</a>
                    {% if user.is_staff %}
                        <a href="{% url 'bulk-add' %}">Bulk Add</a>
                        <a href="{% url 'manage-quizzes' %}">Manage Quizzes</a>
                        <a href="/admin/">Admin</a>
                    {% endif %}
                    <form action="{% url 'logout' %}" method="post" class="logout-form">
                        {% csrf_token %}
                        <button type="submit" class="link-button">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}">Login</a>
                    <a href="{% url 'register' %}" class="nav-cta">Register</a>
                    <a href="/admin/login/" class="nav-admin">Admin</a>
                {% endif %}
            </nav>
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>&copy; 2026 Online Quiz</p>
    </footer>
    <script>
        (function () {
            var header = document.querySelector('header');
            function onScroll() {
                if (window.scrollY > 10) {
                    header.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                }
            }
            window.addEventListener('scroll', onScroll);
            onScroll();
        })();
    </script>
</body>
</html>
