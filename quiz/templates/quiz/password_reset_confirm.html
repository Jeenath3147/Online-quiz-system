{% extends 'quiz/base.html' %}

{% block content %}
<div class="auth-container">
    {% if validlink %}
        <h2>Set a new password</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="submit-btn">Change password</button>
        </form>
    {% else %}
        <h2>Link expired</h2>
        <p class="auth-subtitle">This password reset link is no longer valid — it may have already been used, or it's too old.</p>
        <p class="auth-switch"><a href="{% url 'password_reset' %}">Request a new link</a></p>
    {% endif %}
</div>
{% endblock %}
