{% extends 'quiz/base.html' %}

{% block content %}
<div class="auth-container">
    <h2>Reset your password</h2>
    <p class="auth-subtitle">Enter the email address on your account and we'll send you a link to choose a new password.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="submit-btn">Send reset link</button>
    </form>
    <p class="auth-switch"><a href="{% url 'login' %}">Back to login</a></p>
</div>
{% endblock %}
